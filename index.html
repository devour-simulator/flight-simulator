<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端飞行模拟器</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1625;color:#e9f4ff;font-family:Inter,"Microsoft YaHei",sans-serif;overflow:hidden}#sim{height:100vh;position:relative;background:#87cceb}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;padding:22px;pointer-events:none}.logo{font-weight:800;font-size:11px;letter-spacing:.2em;color:#c9e8ff}.logo b{display:block;font-size:25px;color:#fff;letter-spacing:.05em;margin-top:3px}.readout{display:flex;gap:8px}.instrument{min-width:86px;padding:8px 12px;border:1px solid #ffffff48;border-radius:7px;background:#06111bbd;backdrop-filter:blur(7px)}.instrument span{font-size:9px;letter-spacing:.12em;color:#aad2ec;display:block}.instrument strong{font-size:19px}#guide{position:absolute;right:22px;bottom:22px;max-width:240px;padding:14px;border-radius:10px;background:#06111bc9;border:1px solid #ffffff3d;font-size:12px;line-height:1.8;color:#c5dded}#start{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(#0c2d4c9b,#06111b28)}#start.off{display:none}.card{padding:32px 38px;border-radius:16px;background:#061524d9;border:1px solid #c7e6ff4f;box-shadow:0 18px 55px #00101e99}.card h1{font-size:clamp(32px,6vw,50px);margin:7px 0;letter-spacing:.08em}.card p{line-height:1.7;color:#bdd8eb}.card button{margin-top:10px;border:0;border-radius:8px;padding:13px 28px;background:#f3bd43;color:#142236;font:800 15px inherit;cursor:pointer}.land{color:#f8cb63}@media(max-width:600px){.top{padding:14px}.readout{gap:4px}.instrument{min-width:58px;padding:5px 7px}.instrument strong{font-size:14px}.logo b{font-size:18px}#guide{left:14px;right:14px;bottom:14px;max-width:none}.card{padding:25px 21px}}
</style></head><body><main id="sim"><canvas id="sky" width="1280" height="800"></canvas><div class="top"><div class="logo">FLIGHT SIMULATOR<b>云端飞行</b></div><div class="readout"><div class="instrument"><span>空速</span><strong id="spd">280</strong></div><div class="instrument"><span>高度</span><strong id="alt">3200</strong></div><div class="instrument"><span>航向</span><strong id="hdg">090°</strong></div></div></div><div id="guide">W / ↑ 抬头　S / ↓ 俯冲<br>A / ← 左转　D / → 右转<br>鼠标或手指拖动也可操控飞机<br><span class="land">目标：沿着导航环飞行，平稳降落机场</span></div><div id="start"><section class="card"><div class="logo">READY FOR TAKEOFF</div><h1>云端飞行模拟器</h1><p id="startText">驾驶轻型飞机，穿过导航点并尝试<br>在跑道上平稳降落。</p><button id="begin">开始飞行</button></section></div></main><script src="game.js"></script></body></html>
