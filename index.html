<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端飞行模拟器 · 3D</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#85caed;color:#fff;font-family:Inter,"Microsoft YaHei",sans-serif}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none;padding:20px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:11px;font-weight:900;letter-spacing:.2em;color:#e6f7ff;text-shadow:0 2px 8px #003657}.brand b{display:block;font-size:27px;letter-spacing:.05em;margin-top:3px}.readouts{display:flex;gap:8px}.meter{min-width:82px;padding:7px 11px;border:1px solid #d9f5ff77;background:#062238b5;border-radius:7px;backdrop-filter:blur(8px)}.meter span{display:block;color:#a6d8ef;font-size:9px;letter-spacing:.1em}.meter strong{font-size:19px}.hint{position:fixed;right:20px;bottom:20px;padding:12px 14px;border:1px solid #ffffff55;border-radius:9px;background:#062238bb;line-height:1.75;font-size:12px;color:#d8f1ff}.hint b{color:#ffd465}#start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#09345576,#06152318);text-align:center}.card{padding:32px 38px;max-width:510px;border:1px solid #e3f7ff63;border-radius:17px;background:#051a2add;box-shadow:0 20px 70px #00203a99;backdrop-filter:blur(12px)}h1{margin:8px 0;font-size:clamp(33px,7vw,56px);letter-spacing:.08em}.card p{line-height:1.7;color:#cde6f5}.card button{cursor:pointer;border:0;border-radius:8px;padding:13px 28px;background:linear-gradient(135deg,#ffe380,#ecaa31);color:#132334;font:800 15px inherit}.off{display:none}@media(max-width:600px){.hud{padding:13px}.brand b{font-size:18px}.readouts{gap:4px}.meter{min-width:56px;padding:5px 7px}.meter strong{font-size:14px}.hint{left:13px;right:13px;bottom:13px}.card{margin:15px;padding:25px 20px}}
</style></head><body><div id="game"></div><div class="hud"><div class="brand">FLIGHT SIMULATOR · 3D<b>云端飞行</b></div><div class="readouts"><div class="meter"><span>空速</span><strong id="speed">280</strong></div><div class="meter"><span>高度</span><strong id="altitude">3200</strong></div><div class="meter"><span>航向</span><strong id="heading">090°</strong></div></div></div><div class="hint">W / ↑ 抬头　S / ↓ 俯冲<br>A / ← 左转　D / → 右转<br>鼠标或手指拖动操控视角<br><b>目标：跟随黄色航标飞向机场</b></div><div id="start"><section class="card"><div class="brand">FLIGHT SIMULATOR · 3D</div><h1>云端飞行</h1><button id="startButton" type="button">启动飞行</button></section></div><script type="module" src="game.js"></script></body></html>
